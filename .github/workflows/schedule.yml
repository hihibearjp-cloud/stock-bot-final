name: Daily Stock Schedule
on:
  schedule:
    - cron: '53 3 * * *'
  workflow_dispatch:
    inputs:
      temp_stock:
        description: '🔍 臨時查股 (留白則執行每日雷達，台股請加 .TW)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests ta

      - name: Run script and Generate HTML
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TEMP_STOCK: ${{ inputs.temp_stock }}
        run: |
          TARGET=$(find . -name "main.py" | head -n 1)
          python "$TARGET"

      - name: Commit and Push HTML
        # 💡 魔法在這裡：只有當「沒有」輸入臨時股票時，才會去更新網頁
        if: ${{ inputs.temp_stock == '' }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update Dashboard HTML"
          git push origin HEAD:main
