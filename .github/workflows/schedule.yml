name: Daily Stock Schedule
on:
  schedule:
    # 💡 故意設定奇數分鐘，完美避開 GitHub 全球整點塞車潮！
    - cron: '17 2 * * 1-5'   # 🇹🇼 台灣時間 10:17 (台股早盤突擊)
    - cron: '37 4 * * 1-5'   # 🇹🇼 台灣時間 12:37 (台股尾盤確認)
    - cron: '37 14 * * 1-5'  # 🇺🇸 台灣時間 22:37 (美股開盤突擊)
    - cron: '17 18 * * 1-5'  # 🇺🇸 台灣時間 02:17 (美股盤中確認)
  workflow_dispatch:
    inputs:
      temp_stock:
        description: '🔍 臨時查股 (留白則執行每日雷達，台股請加 .TW)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests ta

      - name: Run script and Generate HTML
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TEMP_STOCK: ${{ inputs.temp_stock }}
        run: |
          TARGET=$(find . -name "main.py" | head -n 1)
          python "$TARGET"

      - name: Commit and Push HTML
        if: ${{ inputs.temp_stock == '' }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update Dashboard HTML"
          git push origin HEAD:main
